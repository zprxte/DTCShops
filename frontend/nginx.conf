# nginx ของ production image (frontend/Dockerfile.prod)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # นำเข้า Excel ส่งไฟล์ ≤5MB และส่งแถวทั้งไฟล์กลับไปตอน /plan, /commit (backend รับถึง 50MB)
  client_max_body_size 50m;

  # API และรูปที่อัปโหลด → backend (ชื่อ service ใน docker-compose.prod.yml)
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    # backend ตั้ง TRUST_PROXY=1 แล้วใช้ค่านี้เป็น IP จริงของผู้ใช้สำหรับ rate limit
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /uploads/ {
    proxy_pass http://backend:4000;
    expires 7d;
  }

  # ไฟล์ที่ Vite ใส่ hash ในชื่อ แคชได้ยาว
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Vue Router ใช้ history mode — ทุกเส้นทางที่ไม่ใช่ไฟล์จริงต้องได้ index.html
  # (เปิด /product/xxx หรือ /admin/products ตรงๆ / กดรีเฟรช แล้วไม่ 404)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
