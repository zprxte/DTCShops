# ==========================================================================
# 1. ความเป็นมาและความสำคัญของปัญหา
# ==========================================================================
background_and_problem_significance: >
  บริษัท ดี.ที.ซี. เอ็นเตอร์ไพรส์ จำกัด (มหาชน) ประกอบธุรกิจจำหน่ายสินค้าอิเล็กทรอนิกส์
  สำหรับยานยนต์และระบบติดตามยานพาหนะ อาทิ กล้องติดรถยนต์ (Dashcam) และอุปกรณ์
  บอกตำแหน่ง (GPS Tracking) ซึ่งมีความหลากหลายทั้งในด้านยี่ห้อ รุ่น และคุณลักษณะเฉพาะ
  ทางเทคนิค อันเป็นปัจจัยสำคัญที่ลูกค้าใช้ประกอบการตัดสินใจเลือกซื้อ อย่างไรก็ตาม
  ด้วยจำนวนสินค้าและความซับซ้อนของข้อมูลดังกล่าว การเปิดดูรายละเอียดสินค้าทีละรายการ
  แล้วอาศัยการจดจำหรือเปรียบเทียบด้วยสายตาเพียงลำพัง ย่อมก่อให้เกิดความล่าช้าและ
  ความคลาดเคลื่อนในการตัดสินใจซื้อได้โดยง่าย

  จากการศึกษาสภาพปัญหาที่เกิดขึ้นจริงในการปฏิบัติงาน พบว่าปัญหาดังกล่าวประกอบด้วย
  สาเหตุสำคัญสองประการที่เชื่อมโยงและส่งเสริมกันอยู่ ประการแรกคือด้านพนักงานขาย
  (ทีม Sale) ซึ่งต้องรับผิดชอบดูแลสินค้าจำนวนมากในหลายกลุ่มผลิตภัณฑ์ หลายยี่ห้อ
  และหลายรุ่นพร้อมกัน โดยสินค้าแต่ละรุ่นล้วนมีคุณลักษณะทางเทคนิคปลีกย่อยที่แตกต่างกัน
  เป็นจำนวนมาก ส่งผลให้พนักงานขายไม่สามารถจดจำและอ้างอิงคุณสมบัติของสินค้าทุกรายการ
  ได้อย่างครบถ้วนและทันท่วงที เมื่อต้องตอบข้อซักถามของลูกค้าทั้งในสถานที่และทางโทรศัพท์
  ประการที่สองคือด้านลูกค้า ซึ่งมักเรียกขานสินค้าด้วยชื่อย่อ ชื่อทางการตลาด หรือคำเรียก
  ที่สืบทอดกันมาแบบปากต่อปาก อันแตกต่างไปจากชื่อรุ่นหรือคำศัพท์ที่ถูกบันทึกไว้อย่างเป็น
  ทางการในระบบข้อมูลของบริษัท ยกตัวอย่างเช่น ลูกค้ากล่าวถึงคำว่า "GPS" ในขณะที่ชื่อ
  สินค้าจริงในระบบใช้คำว่า "Tracking" หรือมีการออกเสียง/สะกดชื่อรุ่นคลาดเคลื่อนไปจาก
  ความเป็นจริง เมื่อสาเหตุทั้งสองประการนี้เกิดขึ้นพร้อมกัน การสื่อสารระหว่างพนักงานขาย
  กับลูกค้าจึงเกิดความติดขัด ต้องใช้เวลานานกว่าทั้งสองฝ่ายจะเข้าใจตรงกันว่าสินค้าที่กล่าวถึง
  คือรายการใด ซึ่งอาจนำไปสู่ความลังเลหรือการสูญเสียความเชื่อมั่นของลูกค้าในการตัดสินใจ
  ซื้อ และส่งผลกระทบต่อเนื่องไปยังประสิทธิภาพในการปิดการขายของทีม Sale โดยตรง

  นอกเหนือจากปัญหาด้านการสื่อสารและข้อจำกัดในการจดจำข้อมูลแล้ว ระบบค้นหาสินค้าแบบ
  ดั้งเดิมที่อาศัยการจับคู่ตัวอักษรอย่างตรงไปตรงมา (exact match) ยังมีแนวโน้มพลาดผลลัพธ์
  ที่เกี่ยวข้องอยู่เสมอ เมื่อผู้ใช้งานพิมพ์คำค้นผิดพลาด พิมพ์เพียงคำย่อ หรือใช้คำพ้องความหมาย
  ที่แตกต่างไปจากชื่อสินค้าจริงในระบบดังตัวอย่างข้างต้น ยิ่งตอกย้ำให้ปัญหาเดิมทวีความรุนแรง
  มากยิ่งขึ้น เนื่องจากแม้แต่ระบบค้นหาเองก็อาจแสดงผลลัพธ์ว่า "ไม่พบสินค้าที่ค้นหา" ทั้งที่
  สินค้ารายการนั้นมีอยู่จริงในคลังสินค้า

  จากประเด็นปัญหาข้างต้น ทางบริษัทจึงมีความประสงค์ให้พัฒนาเว็บแอปพลิเคชันสำหรับค้นหา
  และเปรียบเทียบสินค้าขึ้น เพื่อใช้เป็นเครื่องมือสนับสนุนการปฏิบัติงานของทีม Sale โดยตรง
  ให้พนักงานขายมีเครื่องมือกลางสำหรับสืบค้นและเปรียบเทียบคุณลักษณะของสินค้าได้อย่าง
  รวดเร็วในระหว่างการให้บริการลูกค้า ลดการพึ่งพาความจำส่วนบุคคล ควบคู่ไปกับการออกแบบ
  ให้เว็บไซต์ส่วนสาธารณะ (Public) เปิดโอกาสให้ **ลูกค้าสามารถเข้าถึงและใช้งานระบบค้นหา
  เปรียบเทียบสินค้าได้ด้วยตนเองโดยตรงเช่นเดียวกัน** มิได้จำกัดขอบเขตการใช้งานไว้เฉพาะ
  ทีม Sale เพื่อทำหน้าที่แทนลูกค้าแต่เพียงฝ่ายเดียว ทั้งนี้เพื่ออำนวยความสะดวกแก่ลูกค้าที่
  ประสงค์จะศึกษาและเปรียบเทียบข้อมูลสินค้าด้วยตนเองก่อนการตัดสินใจซื้อ ด้วยเหตุนี้จึงมี
  ความจำเป็นที่จะต้องพัฒนาระบบซึ่งรองรับทั้งการค้นหาและเปรียบเทียบสินค้าที่ใช้งานง่าย
  สำหรับผู้ใช้งานทั่วไป (ครอบคลุมทั้งทีม Sale และลูกค้า) ควบคู่ไปกับระบบบริหารจัดการ
  ข้อมูลเบื้องหลังที่มีประสิทธิภาพสำหรับผู้ดูแลระบบ เพื่อให้ข้อมูลสินค้าที่นำเสนอต่อผู้ใช้งาน
  มีความถูกต้องและเป็นปัจจุบันอยู่เสมอ

# ==========================================================================
# 2. วัตถุประสงค์ของโครงการ
# ==========================================================================
# วัตถุประสงค์ของโครงงาน = การกำหนดจุดมุ่งหมายปลายทางที่ชัดเจนว่าต้องการให้เกิดอะไรขึ้นจากการศึกษาค้นคว้า/ปฏิบัติงานนี้
# ตามหลักการเขียนรายงานสหกิจศึกษา ต้องครอบคลุมทั้ง 2 มิติ ไม่ใช่แค่ "ระบบทำอะไรได้บ้าง":
#   (1) เป้าหมายด้านผลผลิต (product goal) - ระบบที่จะพัฒนาขึ้นเพื่อแก้ปัญหาจริงของสถานประกอบการ
#   (2) เป้าหมายเชิงการเรียนรู้ของผู้จัดทำ (learning goal) - การลงมือปฏิบัติจริง กระบวนการคิดแก้ปัญหา และทักษะที่ได้ฝึกฝน
objectives:
  - "เพื่อศึกษาและวิเคราะห์ปัญหาการค้นหาและเปรียบเทียบสินค้าที่เกิดขึ้นจริงในการปฏิบัติงานของทีมขาย แล้วนำมาออกแบบเป็นแนวทางแก้ไขด้วยเทคโนโลยีที่เหมาะสม"
  - "เพื่อพัฒนาเว็บแอปพลิเคชันฝั่งผู้ใช้งานทั่วไป (Public) ที่รองรับการค้นหาสินค้าแบบผ่อนปรน (Fuzzy Search) พร้อมระบบแนะนำคำค้นอัตโนมัติ และการเปรียบเทียบคุณลักษณะสินค้าแบบเคียงข้างกันได้สูงสุด 4 รายการ เพื่อให้ทีมขายและลูกค้าสืบค้นและเปรียบเทียบข้อมูลสินค้าได้อย่างรวดเร็วและแม่นยำ"
  - "เพื่อพัฒนาระบบบริหารจัดการข้อมูลสินค้า (Admin Panel) ที่ครบวงจร ทั้งการเพิ่ม/แก้ไข/ลบสินค้า การจัดการหมวดหมู่ ยี่ห้อ คุณสมบัติ และคำพ้องความหมาย ตลอดจนการนำเข้าข้อมูลจำนวนมากผ่านไฟล์ Excel เพื่อให้ข้อมูลสินค้าที่นำเสนอต่อผู้ใช้งานมีความถูกต้องและเป็นปัจจุบันอยู่เสมอ"
  - "เพื่อพัฒนาระบบแดชบอร์ดและรายงานเชิงสถิติของการค้นหา การเข้าชม และการเปรียบเทียบสินค้า สำหรับสนับสนุนการวางแผนการตลาดและการตัดสินใจเชิงธุรกิจของสถานประกอบการ"
  - "เพื่อฝึกฝนทักษะการพัฒนาซอฟต์แวร์แบบครบวงจร (Full-stack Development) ด้วยการลงมือปฏิบัติด้วยตนเองทุกขั้นตอน ตั้งแต่การออกแบบฐานข้อมูล การพัฒนา API การเชื่อมต่อระบบส่วนหน้า-หลัง จนถึงการนำระบบขึ้นใช้งานจริงด้วย Docker"
  - "เพื่อฝึกกระบวนการคิดแก้ปัญหาอย่างเป็นระบบ (Problem-Solving) ผ่านการเก็บรวบรวมความต้องการจากผู้ใช้งานจริง การกำหนดและปรับขอบเขตงานตามข้อจำกัดที่พบระหว่างพัฒนา และการตัดสินใจเลือกแนวทางแก้ไขทางเทคนิคที่เหมาะสมกับปัญหา"
  - "เพื่อนำความรู้ทางทฤษฎีที่ได้ศึกษาในสถาบันการศึกษามาประยุกต์ใช้ในการปฏิบัติงานจริง ณ   สถานประกอบการ และสั่งสมประสบการณ์การทำงานที่สามารถนำไปต่อยอดในการประกอบอาชีพได้ในอนาคต"

# ==========================================================================
# 3. ขอบเขตการดำเนินงาน
# ==========================================================================
scope_of_work:
  public_side: >
    ในส่วนของผู้ใช้งานทั่วไป ระบบรองรับการค้นหาสินค้าด้วยคำสำคัญ (Keyword) และด้วย
    ระบบค้นหาแบบผ่อนปรนที่แม้พิมพ์ผิดพลาดหรือใกล้เคียงก็ยังสามารถค้นพบสินค้าได้ มีระบบ
    แนะนำคำค้นหาโดยอัตโนมัติในขณะพิมพ์ สามารถเรียกดูรายการสินค้าทั้งหมดในรูปแบบตาราง
    ภาพ (Grid) ซึ่งแสดงรูปภาพ ชื่อ ราคา และยี่ห้อของสินค้า เรียกดูสินค้าแยกตามหมวดหมู่
    เรียกดูรายละเอียดของสินค้าแต่ละรายการพร้อมคลังภาพและรายการสินค้าที่เกี่ยวข้อง เพิ่ม
    สินค้าเข้าสู่ตะกร้าเปรียบเทียบได้สูงสุด 4 รายการ พร้อมตารางเปรียบเทียบแบบเคียงข้างกัน
    การเน้นย้ำค่าที่ดีกว่าหรือด้อยกว่า และความสามารถในการแชร์ลิงก์ผลการเปรียบเทียบ
    ตลอดจนสามารถสลับการใช้งานได้ 3 ภาษา ได้แก่ ไทย อังกฤษ และญี่ปุ่น

  admin_side: >
    ในส่วนของผู้ดูแลระบบ (Admin) ระบบรองรับการเข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่าน ผ่าน
    กลไก JWT และการเข้ารหัส bcrypt การเรียกดูแดชบอร์ดสรุปภาพรวมของการค้นหาและสินค้า
    ยอดนิยม พร้อมกราฟแสดงแนวโน้มการค้นหา การเพิ่มสินค้าใหม่ทีละรายการผ่านแบบฟอร์ม
    พร้อมกำหนดคุณสมบัติเฉพาะแบบไดนามิกตามหมวดหมู่ การแก้ไขและลบสินค้าโดยมีกลไก
    ป้องกันมิให้ข้อมูลที่ถูกอ้างอิงอยู่เสียหาย การอัปโหลดรูปภาพสินค้าจากเครื่องโดยตรงหรือ
    ระบุลิงก์รูปภาพจากภายนอก การบริหารจัดการหมวดหมู่สินค้า ยี่ห้อสินค้า คุณสมบัติ/สเปค
    และคำพ้องความหมายสำหรับระบบค้นหาแบบครบวงจร การนำเข้าข้อมูลสินค้าจำนวนมาก
    ผ่านไฟล์ Excel พร้อมหน้าแสดงตัวอย่างข้อมูลก่อนยืนยันการนำเข้าจริง ตลอดจนการเรียกดู
    บันทึกการค้นหาของผู้ใช้งาน สรุปสถิติการเข้าชมสินค้าเรียงลำดับจากมากไปน้อย และบันทึก
    รายการเปรียบเทียบสินค้า

  out_of_scope: >
    อย่างไรก็ตาม มีส่วนงานบางประการที่ยังมิได้อยู่ในขอบเขตการนำเสนอของโครงการนี้
    ได้แก่ หน้าเรียกดูสินค้าจำแนกตามยี่ห้อโดยเฉพาะ เนื่องจากยังไม่มีช่องทางเชื่อมต่อ
    (Endpoint) สำหรับดึงรายชื่อยี่ห้อในฝั่งสาธารณะ ระบบต่ออายุสิทธิ์การเข้าใช้งานโดย
    อัตโนมัติ (Refresh Token) โดยระบบปัจจุบันใช้โทเคน JWT ที่มีอายุการใช้งาน 8 ชั่วโมง
    เพียงอย่างเดียว การเก็บประวัติการนำเข้าไฟล์ Excel ย้อนหลัง เนื่องจากไม่มีตารางฐาน
    ข้อมูลรองรับในโครงสร้างที่กำหนดไว้ตายตัว ตลอดจนการขยายคำค้นด้วยคำพ้องความหมาย
    และการจัดอันดับผลลัพธ์การค้นหาตามความเกี่ยวข้อง (Relevance Ranking) ในฐานะ
    ฟังก์ชันค้นหาที่นำเสนอแยกต่างหาก ซึ่งข้อมูลดังกล่าวยังคงสามารถบริหารจัดการได้ผ่าน
    ทางฝั่งผู้ดูแลระบบเช่นเดิม

# ==========================================================================
# 4. ประโยชน์ที่คาดว่าจะได้รับ
# ==========================================================================
expected_benefits:
  for_end_users: >
    สำหรับผู้ใช้งานทั่วไป ซึ่งครอบคลุมทั้งพนักงานฝ่ายขายที่นำระบบไปใช้ประกอบการให้
    บริการลูกค้า และลูกค้าที่เข้ามาสืบค้นข้อมูลด้วยตนเองโดยตรง ระบบจะช่วยให้การค้นหา
    สินค้าเป็นไปด้วยความรวดเร็วและแม่นยำยิ่งขึ้น แม้ในกรณีที่พิมพ์คำค้นผิดพลาด พิมพ์ไม่
    ครบถ้วน หรือใช้ชื่อย่อ/คำเรียกที่แตกต่างไปจากชื่อรุ่นที่บันทึกไว้จริงในระบบ สามารถ
    เปรียบเทียบคุณลักษณะและราคาของสินค้าหลายรุ่นได้พร้อมกันในหน้าเดียว อันช่วยลด
    ระยะเวลาในการอธิบายและการตัดสินใจเลือกซื้อ ทั้งยังช่วยลดโอกาสที่พนักงานขายและ
    ลูกค้าจะสื่อสารเข้าใจคลาดเคลื่อนไปคนละรายการสินค้า นอกจากนี้ยังสามารถเข้าถึงข้อมูล
    สินค้าได้ในภาษาที่ถนัด ทั้งภาษาไทย ภาษาอังกฤษ และภาษาญี่ปุ่น

  for_admin_and_organization: >
    สำหรับฝ่ายผู้ดูแลระบบและองค์กร ระบบจะช่วยลดระยะเวลาและความคลาดเคลื่อนในการ
    บริหารจัดการข้อมูลสินค้า ด้วยแบบฟอร์มบันทึกข้อมูลแบบครบวงจรและระบบนำเข้าข้อมูล
    ผ่านไฟล์ Excel ที่มีการแสดงตัวอย่างและตรวจสอบความถูกต้องของข้อมูลก่อนการบันทึก
    จริง อีกทั้งยังมีข้อมูลเชิงสถิติ อาทิ คำค้นหาที่ได้รับความนิยม สินค้าที่ได้รับความสนใจ
    สูงสุด และกลุ่มสินค้าที่มักถูกนำมาเปรียบเทียบร่วมกันบ่อยครั้ง ซึ่งสามารถนำไปใช้ประกอบ
    การวางแผนการตลาดและการจัดโปรโมชั่นสินค้าคู่ในอนาคตได้ นอกจากนี้ ระบบยังมีมาตรการ
    ด้านความปลอดภัยขั้นพื้นฐาน อาทิ การพิสูจน์ตัวตนด้วยโทเคน JWT การจำกัดจำนวนคำขอ
    ต่อช่วงเวลา (Rate Limiting) และการเข้ารหัสรหัสผ่านผู้ใช้งาน ซึ่งช่วยลดความเสี่ยงด้าน
    การรั่วไหลของข้อมูลหรือการถูกโจมตีทางไซเบอร์

  for_developer_team: >
    สำหรับทีมผู้พัฒนา โครงการนี้นับเป็นโอกาสอันดีในการฝึกฝนทักษะการพัฒนาระบบซอฟต์แวร์
    แบบครบวงจร (Full-stack Development) ตั้งแต่กระบวนการออกแบบโครงสร้างฐานข้อมูล
    การพัฒนา API การเชื่อมต่อระบบส่วนหน้าและส่วนหลังเข้าด้วยกัน ไปจนถึงการนำระบบขึ้น
    ใช้งานจริงด้วย Docker Compose โดยอาศัยเทคโนโลยี Vue 3, Node.js/Express และ
    PostgreSQL เป็นแกนหลักของการพัฒนา อันเป็นประสบการณ์ที่สามารถนำไปประยุกต์ใช้ใน
    การปฏิบัติงานจริงต่อไปในอนาคต

# ==========================================================================
# 5. ขั้นตอนและวิธีการดำเนินงาน
# ==========================================================================
methodology:
  approach: >
    การพัฒนาระบบดำเนินการตามแนวทาง Agile แบบแบ่งช่วงการทำงานเป็นสัปดาห์ (Sprint-
    based) รวมระยะเวลาทั้งสิ้น 16 สัปดาห์ แบ่งออกเป็น 5 ระยะ (Phase) โดยแต่ละระยะจะ
    ส่งมอบฟีเจอร์ที่สามารถใช้งานได้จริงเป็นลำดับขั้น (Incremental Delivery) พร้อมทั้งมี
    การทดสอบระบบควบคู่ไปกับการพัฒนาในทุกขั้นตอน เพื่อให้มั่นใจได้ว่าแต่ละส่วนของระบบ
    ทำงานได้อย่างถูกต้องก่อนดำเนินการในลำดับถัดไป

  phases: >
    การดำเนินงานแบ่งออกเป็น 5 ระยะตลอดระยะเวลา 16 สัปดาห์ โดยระยะที่ 1 (สัปดาห์ที่
    1-3) เป็นการวางรากฐานของระบบ ได้แก่ การตั้งค่าโครงสร้างโปรเจกต์ทั้งฝั่งส่วนหน้า
    (Frontend) และส่วนหลัง (Backend) การออกแบบและจัดสร้างฐานข้อมูล PostgreSQL
    ผ่าน Docker Compose การพัฒนาระบบพิสูจน์ตัวตนผู้ดูแลระบบด้วย JWT และ bcrypt
    และการพัฒนา API หลักของระบบ ระยะที่ 2 (สัปดาห์ที่ 4-6) มุ่งเน้นการพัฒนาระบบค้นหา
    ทั้งการค้นหาแบบเต็มข้อความ (Full-text Search) ด้วย PostgreSQL tsvector/tsquery
    ระบบค้นหาแบบผ่อนปรนด้วยส่วนขยาย pg_trgm สำหรับรองรับคำค้นที่พิมพ์ผิดพลาด ระบบ
    แนะนำคำค้นอัตโนมัติแบบหน่วงเวลา (Debounce) และระบบตัวกรอง/การเน้นย้ำผลการ
    ค้นหา ระยะที่ 3 (สัปดาห์ที่ 7-9) พัฒนาในส่วนของหน้าแสดงสินค้า ทั้งหน้ารายการสินค้า
    แบบตารางภาพ หน้าเรียกดูสินค้าตามหมวดหมู่ หน้ารายละเอียดสินค้า และฟีเจอร์เปรียบเทียบ
    สินค้าแบบเคียงข้างกันพร้อมการเน้นย้ำค่าที่ดีกว่า/ด้อยกว่า และการแชร์ลิงก์ผลการเปรียบ
    เทียบ ระยะที่ 4 (สัปดาห์ที่ 10-13) พัฒนาส่วนของผู้ดูแลระบบ (Admin Panel) ทั้งแดชบอร์ด
    สรุปสถิติ แบบฟอร์มเพิ่ม/แก้ไขสินค้าพร้อมระบบอัปโหลดรูปภาพ ฟีเจอร์นำเข้าข้อมูลสินค้า
    ผ่านไฟล์ Excel และหน้าบริหารจัดการข้อมูลหลัก (หมวดหมู่/ยี่ห้อ/คุณสมบัติ/คำพ้องความ
    หมาย) และระยะที่ 5 (สัปดาห์ที่ 14-16) เป็นการปรับปรุงคุณภาพและทดสอบระบบโดยรวม
    ทั้งการปรับปรุงประสบการณ์การใช้งาน (UI/UX) การเสริมสร้างความปลอดภัยและ
    ประสิทธิภาพของระบบ ตลอดจนการทดสอบระบบและจัดทำเอกสารประกอบการติดตั้งใช้งาน

  development_workflow: >
    กระบวนการพัฒนาเริ่มต้นจากการออกแบบและยืนยันขอบเขตการดำเนินงานตลอดจนโครงสร้าง
    ฐานข้อมูลร่วมกับผู้มีส่วนได้ส่วนเสียก่อนเริ่มดำเนินการพัฒนา จากนั้นจึงพัฒนาส่วนของ
    Backend API ก่อนเป็นลำดับแรก แล้วจึงต่อยอดพัฒนาส่วน Frontend ให้เรียกใช้งาน API
    จริงอยู่เสมอโดยไม่อาศัยข้อมูลจำลอง ทุกฟีเจอร์จะได้รับการทดสอบผ่านข้อมูลจริงในฐาน
    ข้อมูล (โดยใช้ข้อมูลทดสอบที่สามารถลบทิ้งได้ภายหลังโดยไม่กระทบต่อข้อมูลจริง) ก่อนที่
    จะถือว่าการดำเนินงานในแต่ละส่วนเสร็จสมบูรณ์ และมีการบันทึกความคืบหน้าตลอดจนการ
    เปลี่ยนแปลงขอบเขตงานไว้เป็นลายลักษณ์อักษรตลอดระยะเวลาการพัฒนา

# ==========================================================================
# 6. อุปกรณ์และเครื่องมือที่ใช้
# ==========================================================================
tools_and_equipment: >
  ในการพัฒนาระบบส่วนหน้า (Frontend) ใช้ Vue 3 (Composition API รูปแบบ script setup)
  ร่วมกับภาษา TypeScript, Vite เป็นเครื่องมือสำหรับการ build, Vue Router 4 สำหรับบริหาร
  จัดการเส้นทางการเข้าถึงหน้าเว็บ, Pinia สำหรับบริหารจัดการสถานะของแอปพลิเคชัน, Tailwind
  CSS สำหรับออกแบบส่วนติดต่อผู้ใช้งาน, Axios สำหรับเรียกใช้งาน API, และ lucide-vue-next
  สำหรับชุดสัญลักษณ์ไอคอน ในส่วนของระบบหลังบ้าน (Backend) ใช้ Node.js ร่วมกับ Express
  เป็นเฟรมเวิร์กหลัก, Prisma เป็นเครื่องมือ ORM สำหรับเชื่อมต่อฐานข้อมูล, jsonwebtoken
  และ bcrypt สำหรับระบบพิสูจน์ตัวตน, Zod สำหรับตรวจสอบความถูกต้องของข้อมูล, ExcelJS
  สำหรับประมวลผลไฟล์ Excel, Multer สำหรับอัปโหลดไฟล์ และ Helmet, express-rate-limit,
  CORS สำหรับเสริมสร้างความปลอดภัยของระบบ ในส่วนของฐานข้อมูลใช้ PostgreSQL ร่วมกับ
  ส่วนขยาย pg_trgm สำหรับการค้นหาแบบผ่อนปรน (Fuzzy/Trigram Search) และ tsvector/
  tsquery สำหรับการค้นหาแบบเต็มข้อความ (Full-text Search) ด้านโครงสร้างพื้นฐานใช้
  Docker และ Docker Compose ในการควบคุมการทำงานของฐานข้อมูล ระบบหลังบ้าน และ
  ระบบส่วนหน้าให้ทำงานร่วมกันเป็นชุดเดียว และใช้ Git เป็นเครื่องมือควบคุมรุ่นของซอร์สโค้ด
  ส่วนเครื่องมือที่ใช้สนับสนุนการพัฒนา ได้แก่ Visual Studio Code สำหรับเขียนโค้ด, Postman
  หรือ curl สำหรับทดสอบการทำงานของ API, และ pgAdmin หรือ psql สำหรับตรวจสอบ
  ความถูกต้องของข้อมูลในฐานข้อมูล
